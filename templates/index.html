<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Attendance Insights - Mu Sigma</title>
  <style>
    /* New Consolidated CSS Structure */
    :root {
      --mu-primary: #1976D2; --mu-secondary: #0D47A1; --mu-accent: #FF9800;
      --mu-light: #FFFFFF; --bg-color: #F8F9FA; --text-dark: #212529;
      --shadow-header: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    body {
      font-family: "Inter", Tahoma, sans-serif; text-align: center;
      background: var(--bg-color); color: var(--text-dark);
      margin: 0; padding-top: 100px; min-height: 100vh;
    }
    .header-bar {
      position: fixed; top: 0; left: 0; width: 100%; height: 60px;
      background: var(--mu-light); color: var(--text-dark);
      font-weight: bold; font-size: 18px;
      display: flex; align-items: center;
      padding: 0 30px; box-shadow: var(--shadow-header); z-index: 100;
      border-bottom: 1px solid #E0E0E0;
    }
    .logo-container { display: flex; align-items: center; margin-right: 30px; color: var(--mu-primary); font-size: 20px;}
    .logo-container img { height: 35px; margin-right: 10px; }
    h1 {
      color: var(--mu-primary); font-size: 3.5em; margin-top: 40px; text-shadow: none;
    }
    p { font-size: 1.3em; margin-bottom: 40px; color: #555; }
    .btn-container { margin-top: 60px; }
    .btn {
      padding: 20px 40px; margin: 15px; font-size: 1.1em;
      border-radius: 12px; border: none; cursor: pointer; transition: 0.3s;
      font-weight: bold; color: var(--mu-light); background: var(--mu-primary);
      display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    .btn:hover { background: var(--mu-secondary); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .btn span.icon { color: var(--mu-accent); font-size: 1.5em; }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="logo-container">
      <img src="/static/mu_logo_new.png" alt="Mu Sigma Logo">
    </div>
    <span class="title-text">Mu Sigma Attendance Insights</span>
  </div>
  <h1>Behavioral Data Science Portal</h1>
  <p>Leverage data-driven analysis to understand work patterns and optimize productivity.</p>
  <div class="btn-container">
    <form action="/overview" method="get" style="display:inline-block;">
      <button class="btn"><span class="icon">📊</span> Executive Dashboard</button>
    </form>
    <form action="/employee" method="get" style="display:inline-block;">
      <button class="btn"><span class="icon">👤</span> Employee Deep Dive</button>
    </form>
    <form action="/account" method="get" style="display:inline-block;">
      <button class="btn"><span class="icon">📂</span> Account Performance</button>
    </form>
  </div>
</body>
</html>
